name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript module syntax
        run: |
          node --check src/main.js
          node --check src/character_creation.js
          node --check src/game.js
          node --check src/ai_engine.js
          node --check src/systems.js
          node --check src/geopolitics.js
          node --check src/network.js
          node --check src/event_dispatcher.js
          node --check src/world_lore.js
          node --check src/island_encounters.js
          node --check src/politics.js
          node --check src/ui/hud.js
          node --check src/ui/ui.js
          node --check src/map.js
          node --check src/world3d.js
          node --check src/island_renderer.js
          node --check src/codex_engine.js
          node --check src/vfx_engine.js
      - name: Run test suite
        run: node --test tests/*.test.js
